name: CI/CD Predator Agent

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Run Security Audit
        run: pnpm audit
      
      - name: Run Tests with Coverage
        run: pnpm test
      
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  deploy-green:
    needs: test-and-audit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Green Environment
        run: echo "Deploying to Green environment for Blue-Green strategy..."
      
      - name: Run Smoke Tests on Green
        run: echo "Running health checks on Green..."
      
      - name: Switch Traffic to Green
        run: echo "Switching Load Balancer traffic to Green environment..."
