name: Watchdog Agent - System Health Monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Build
        run: pnpm run build > /dev/null 2>&1 || exit 1
      - name: Check Tests
        run: pnpm test > /dev/null 2>&1 || exit 1
      - name: Create Issue on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Watchdog Alert - Build/Test Failure',
              body: 'Watchdog detected issues. Run: ${{ github.run_id }}',
              labels: ['bug', 'automated', 'watchdog']
            });
